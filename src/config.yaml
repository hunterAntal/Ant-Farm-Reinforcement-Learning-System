# config.yaml - Configuration for Ant Farm RL System

# Environment Settings
GRID_SIZE: 10
MAX_STEPS: 25
FIXED_GOAL: [1, 1]

# Obstacle Settings
OBSTACLE_X: 3
OBSTACLE_Y: 3
OBSTACLE_WIDTH: 7
OBSTACLE_HEIGHT: 4

# Q-learning Hyperparameters
NUM_EPISODES: 40000
ALPHA: 0.1  # Learning rate
GAMMA: 0.99  # Discount factor
EPSILON: 1.0  # Initial exploration rate
EPSILON_DECAY: 0.999  # Decay rate
MIN_EPSILON: 0.01  # Minimum exploration rate
REACHED_GOAL_BONUS: 500  # Reward for reaching the goal

# Parallel Training
NUM_PARALLEL_AGENTS: 4  # Number of agents running in parallel

# Q-table Persistence
Q_TABLE_FILE: "q_table.npy"
CHECKPOINT_INTERVAL: 500  # Save Q-table every N episodes

# View Mode Settings
VIEW_MODE_EPISODES: 100  # Number of episodes to record and play
RECORD_EVERY_N_EPISODES: 10  # Record every Nth episode
PLAYBACK_SPEED: 1.0  # Speed of playback (1.0 = real-time, <1 slower, >1 faster)
